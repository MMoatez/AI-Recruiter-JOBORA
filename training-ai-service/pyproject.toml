[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-recruiter-training-api"
version = "0.1.0"
description = "FastAPI backend for the AI Recruiter training module"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "groq>=0.31,<1",
  "pydantic>=2.10,<3",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.18,<1",
  "pymongo>=4.10,<5",
  "sentence-transformers>=3.4,<4",
  "transformers>=4.41,<5",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "training_experiments*"]
exclude = ["data*", "tests*"]
